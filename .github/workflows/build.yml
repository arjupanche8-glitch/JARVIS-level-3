name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "JARVIS_LEVEL3_ALL_IN_ONE.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract JARVIS project
        run: |
          mkdir -p build-src
          unzip -q JARVIS_LEVEL3_ALL_IN_ONE.zip -d build-src
          test -f build-src/android/settings.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: build-src/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: build-src/android/app/build/outputs/apk/debug/app-debug.apk
